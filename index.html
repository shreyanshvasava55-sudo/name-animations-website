<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Message ✨</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    color:white;
    background:linear-gradient(135deg,#16002e,#72005c,#ff2d75);
    transition:background 1s ease;
}

.screen{
    width:100%;
    height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-y:auto;
}

.screen.active{
    display:flex;
}

.card{
    width:100%;
    max-width:440px;
    padding:30px 22px;
    border-radius:28px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    text-align:center;
    animation:cardIn .7s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.94);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.logo{
    font-size:55px;
    margin-bottom:8px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-9px)}
}

h1{
    font-size:29px;
    margin-bottom:10px;
}

.subtitle{
    opacity:.82;
    line-height:1.5;
    margin-bottom:22px;
}

.input{
    width:100%;
    padding:16px;
    border:none;
    outline:none;
    border-radius:15px;
    font-size:16px;
    margin-bottom:15px;
    background:white;
    color:#222;
}

.fileBox{
    display:block;
    padding:20px;
    border:2px dashed rgba(255,255,255,.55);
    border-radius:18px;
    cursor:pointer;
    margin-bottom:15px;
    transition:.3s;
}

.fileBox:hover{
    background:rgba(255,255,255,.12);
}

.fileBox input{
    display:none;
}

.fileIcon{
    font-size:40px;
    margin-bottom:5px;
}

.small{
    font-size:12px;
    opacity:.7;
    margin-top:5px;
}

.preview{
    width:125px;
    height:125px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin:3px auto 18px;
    display:none;
    box-shadow:0 0 30px rgba(255,255,255,.6);
}

.btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:16px;
    background:white;
    color:#71005d;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:9px;
    transition:.25s;
}

.btn:hover{
    transform:scale(1.03);
}

.btn:active{
    transform:scale(.97);
}

.back{
    background:rgba(255,255,255,.14);
    color:white;
}

.error{
    display:none;
    color:#ffd4d4;
    font-size:14px;
    margin:10px;
}


/* ================= OPTIONS ================= */

.optionGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
    margin-top:20px;
}

.option{
    min-height:125px;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.12);
    color:white;
    border-radius:21px;
    padding:15px 8px;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,.23);
}

.option:active{
    transform:scale(.96);
}

.optionIcon{
    font-size:38px;
    margin-bottom:9px;
}

.optionTitle{
    font-weight:bold;
    font-size:16px;
}


/* ================= RESULT ================= */

.result{
    position:relative;
    overflow:hidden;
}

.resultContent{
    position:relative;
    z-index:10;
    width:100%;
    max-width:440px;
    text-align:center;
}

.resultPhotoBox{
    width:195px;
    height:195px;
    margin:0 auto 22px;
}

.resultPhoto{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:5px solid white;
    box-shadow:0 0 45px rgba(255,255,255,.75);
    animation:photoIn 1.1s ease;
}

@keyframes photoIn{
    0%{
        transform:scale(.2) rotate(-25deg);
        opacity:0;
    }
    70%{
        transform:scale(1.08) rotate(3deg);
    }
    100%{
        transform:scale(1) rotate(0);
        opacity:1;
    }
}

.resultTitle{
    font-size:31px;
    margin-bottom:15px;
    animation:titleIn 1s ease;
}

@keyframes titleIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message{
    min-height:70px;
    line-height:1.65;
    font-size:17px;
    padding:0 10px;
}

.cursor{
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0}
}


/* ================= PARTICLES ================= */

.particle{
    position:fixed;
    z-index:2;
    pointer-events:none;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(110vh) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(-15vh) rotate(360deg);
        opacity:0;
    }
}


/* ================= CONFETTI ================= */

.confetti{
    position:fixed;
    top:-20px;
    z-index:3;
    width:8px;
    height:15px;
    border-radius:2px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}


/* ================= PHOTO EFFECT ================= */

.glow{
    animation:
        photoIn 1.1s ease,
        glowPulse 1.5s infinite alternate;
}

@keyframes glowPulse{
    from{
        filter:drop-shadow(0 0 5px white);
    }
    to{
        filter:drop-shadow(0 0 30px white);
    }
}


/* ================= THEMES ================= */

.birthday{
    background:linear-gradient(135deg,#ff512f,#dd2476,#6a11cb);
}

.sorry{
    background:linear-gradient(135deg,#21152d,#70435f,#c96c7a);
}

.impress{
    background:linear-gradient(135deg,#19001f,#7b146e,#ff3d81);
}

.friend{
    background:linear-gradient(135deg,#00152e,#005b96,#00a8cc);
}

.thanks{
    background:linear-gradient(135deg,#260009,#8b1e3f,#d6336c);
}


@media(max-width:380px){

    h1{
        font-size:26px;
    }

    .option{
        min-height:110px;
    }

    .resultTitle{
        font-size:27px;
    }

    .resultPhotoBox{
        width:170px;
        height:170px;
    }
}
</style>
</head>


<body>


<!-- ==================================================
     SCREEN 1
================================================== -->

<section id="screen1" class="screen active">

<div class="card">

    <div class="logo">✨</div>

    <h1>Create Magic</h1>

    <p class="subtitle">
        Enter a name and choose a photo<br>
        to create something special 💫
    </p>


    <input
        id="nameInput"
        class="input"
        type="text"
        maxlength="30"
        placeholder="Enter Name..."
        autocomplete="off"
    >


    <label class="fileBox">

        <div class="fileIcon">📸</div>

        <b>Choose Photo</b>

        <div class="small">
            Select from Gallery / File Manager
        </div>

        <input
            id="photoInput"
            type="file"
            accept="image/*"
        >

    </label>


    <img
        id="photoPreview"
        class="preview"
        alt="Photo Preview"
    >


    <div id="error1" class="error">
        Please enter a name and select a photo.
    </div>


    <button
        class="btn"
        onclick="continueToOptions()"
    >
        Continue ✨
    </button>

</div>

</section>



<!-- ==================================================
     SCREEN 2 : 5 OPTIONS
================================================== -->

<section id="screen2" class="screen">

<div class="card">

    <div class="logo">🎨</div>

    <h1>Choose One</h1>

    <p class="subtitle">
        What do you want to create for
        <b id="nameDisplay"></b>?
    </p>


    <div class="optionGrid">


        <!-- OPTION 1 -->

        <button
            class="option"
            onclick="createAnimation('birthday')"
        >

            <div class="optionIcon">
                🎂
            </div>

            <div class="optionTitle">
                Happy Birthday
            </div>

            <div class="small">
                Birthday Celebration
            </div>

        </button>


        <!-- OPTION 2 -->

        <button
            class="option"
            onclick="createAnimation('sorry')"
        >

            <div class="optionIcon">
                🥺
            </div>

            <div class="optionTitle">
                Sorry
            </div>

            <div class="small">
                Say Sorry ❤️
            </div>

        </button>


        <!-- OPTION 3 -->

        <button
            class="option"
            onclick="createAnimation('impress')"
        >

            <div class="optionIcon">
                💖
            </div>

            <div class="optionTitle">
                Impress
            </div>

            <div class="small">
                Special Vibes ✨
            </div>

        </button>


        <!-- OPTION 4 -->

        <button
            class="option"
            onclick="createAnimation('friend')"
        >

            <div class="optionIcon">
                🫶🏻
            </div>

            <div class="optionTitle">
                Best Friend
            </div>

            <div class="small">
                Friendship 💙
            </div>

        </button>


        <!-- OPTION 5 -->

        <button
            class="option"
            onclick="createAnimation('thanks')"
        >

            <div class="optionIcon">
                🌹
            </div>

            <div class="optionTitle">
                Thank You
            </div>

            <div class="small">
                Gratitude ❤️
            </div>

        </button>

    </div>


    <button
        class="btn back"
        onclick="showScreen('screen1')"
    >
        ← Back
    </button>

</div>

</section>



<!-- ==================================================
     SCREEN 3 : RESULT
================================================== -->

<section id="screen3" class="screen result">

<div class="resultContent">


    <div class="resultPhotoBox">

        <img
            id="resultPhoto"
            class="resultPhoto"
            alt="Selected Photo"
        >

    </div>


    <h1
        id="resultTitle"
        class="resultTitle"
    ></h1>


    <div
        id="resultMessage"
        class="message"
    ></div>


    <button
        class="btn"
        onclick="chooseAnother()"
    >
        🎨 Choose Another
    </button>


    <button
        class="btn back"
        onclick="startAgain()"
    >
        🔄 Start Again
    </button>

</div>

</section>



<script>

/* ==================================================
   VARIABLES
================================================== */

let userName = "";

let photoURL = "";

let typingTimer = null;


/* ==================================================
   PHOTO SELECT
================================================== */

document
.getElementById("photoInput")
.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }


    if(!file.type.startsWith("image/")){

        alert("Please select an image.");

        this.value = "";

        return;
    }


    if(photoURL){

        URL.revokeObjectURL(photoURL);

    }


    photoURL =
        URL.createObjectURL(file);


    const preview =
        document.getElementById("photoPreview");


    preview.src = photoURL;

    preview.style.display = "block";

});



/* ==================================================
   CONTINUE
================================================== */

function continueToOptions(){

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim();


    const error =
        document
        .getElementById("error1");


    if(name === "" || photoURL === ""){

        error.style.display = "block";

        return;
    }


    error.style.display = "none";


    userName = name;


    document
    .getElementById("nameDisplay")
    .textContent = userName;


    showScreen("screen2");

}



/* ==================================================
   SCREEN SWITCH
================================================== */

function showScreen(id){

    document
    .querySelectorAll(".screen")
    .forEach(screen=>{

        screen.classList.remove("active");

    });


    document
    .getElementById(id)
    .classList.add("active");

}



/* ==================================================
   ANIMATION DATA
================================================== */

const animations = {

    birthday:{

        theme:"birthday",

        title:name =>
            `Happy Birthday ${name}! 🎂🎉`,

        message:name =>
            `Wishing you a beautiful birthday, ${name}! May your day be filled with happiness, smiles, love and wonderful memories. 🎈✨🎁`,

        particles:[
            "🎈",
            "🎉",
            "🎂",
            "🎁",
            "✨",
            "⭐"
        ],

        confetti:true

    },


    sorry:{

        theme:"sorry",

        title:name =>
            `Sorry ${name}... 🥺❤️`,

        message:name =>
            `I'm really sorry, ${name}. Sometimes a simple sorry carries a lot of meaning. I hope this little message brings a smile to your face. ❤️🫶🏻`,

        particles:[
            "❤️",
            "💗",
            "🥺",
            "🫶🏻",
            "💔",
            "✨"
        ],

        confetti:false

    },


    impress:{

        theme:"impress",

        title:name =>
            `Hey ${name}... 💖✨`,

        message:name =>
            `${name}, you have a way of making ordinary moments feel special. Keep smiling, keep shining and keep being amazing! 💖✨🌟`,

        particles:[
            "💖",
            "💕",
            "✨",
            "⭐",
            "🌟",
            "💗"
        ],

        confetti:false

    },


    friend:{

        theme:"friend",

        title:name =>
            `Best Friend ${name}! 🫶🏻💙`,

        message:name =>
            `Life is better with a good friend like you, ${name}. Here's to more laughs, unforgettable memories and crazy moments together! 🫶🏻💙✨`,

        particles:[
            "💙",
            "🫶🏻",
            "⭐",
            "✨",
            "😄",
            "💫"
        ],

        confetti:true

    },


    thanks:{

        theme:"thanks",

        title:name =>
            `Thank You ${name}! 🌹`,

        message:name =>
            `Thank you, ${name}, for being such a wonderful person. Your presence can make even simple moments feel special. 🌹❤️✨`,

        particles:[
            "🌹",
            "🌸",
            "🌺",
            "❤️",
            "✨",
            "💗"
        ],

        confetti:false

    }

};



/* ==================================================
   CREATE ANIMATION
================================================== */

function createAnimation(type){

    const data =
        animations[type];


    /* Change theme */

    document.body.className =
        data.theme;


    /* Set photo */

    const photo =
        document.getElementById("resultPhoto");


    photo.src = photoURL;


    /* Reset photo animation */

    photo.classList.remove("glow");


    void photo.offsetWidth;


    photo.classList.add("glow");


    /* Set title */

    document
    .getElementById("resultTitle")
    .textContent =
        data.title(userName);


    /* Clear old message */

    document
    .getElementById("resultMessage")
    .innerHTML = "";


    /* Show result */

    showScreen("screen3");


    /* Clear previous effects */

    clearEffects();


    /* Start particles */

    createParticles(
        data.particles,
        50
    );


    /* Birthday/Friend confetti */

    if(data.confetti){

        createConfetti();

    }


    /* Type message */

    typeMessage(
        data.message(userName)
    );

}



/* ==================================================
   TYPING MESSAGE
================================================== */

function typeMessage(text){

    clearInterval(typingTimer);


    const box =
        document.getElementById(
            "resultMessage"
        );


    box.innerHTML = "";


    let index = 0;


    typingTimer =
        setInterval(function(){

            if(index < text.length){

                box.innerHTML =
                    text.substring(
                        0,
                        index + 1
                    ) +
                    `<span class="cursor">|</span>`;

                index++;

            }else{

                clearInterval(typingTimer);

                box.innerHTML = text;

            }

        },32);

}



/* ==================================================
   PARTICLES
================================================== */

function createParticles(items,count){

    for(let i=0;i<count;i++){

        setTimeout(function(){

            const particle =
                document.createElement("div");


            particle.className =
                "particle";


            particle.innerHTML =
                items[
                    Math.floor(
                        Math.random() *
                        items.length
                    )
                ];


            particle.style.left =
                Math.random()*100 +
                "vw";


            particle.style.fontSize =
                (18 +
                Math.random()*25) +
                "px";


            particle.style.animationDuration =
                (4 +
                Math.random()*5) +
                "s";


            particle.style.opacity =
                .55 +
                Math.random()*.45;


            document.body.appendChild(
                particle
            );


            setTimeout(function(){

                particle.remove();

            },9000);


        },i*100);

    }

}



/* ==================================================
   CONFETTI
================================================== */

function createConfetti(){

    for(let i=0;i<100;i++){

        setTimeout(function(){

            const c =
                document.createElement("div");


            c.className =
                "confetti";


            c.style.left =
                Math.random()*100 +
                "vw";


            c.style.animationDuration =
                (2 +
                Math.random()*3) +
                "s";


            c.style.transform =
                `rotate(${Math.random()*360}deg)`;


            document.body.appendChild(c);


            setTimeout(function(){

                c.remove();

            },5500);


        },i*25);

    }

}



/* ==================================================
   CLEAR EFFECTS
================================================== */

function clearEffects(){

    document
    .querySelectorAll(
        ".particle,.confetti"
    )
    .forEach(function(el){

        el.remove();

    });

}



/* ==================================================
   CHOOSE ANOTHER
================================================== */

function chooseAnother(){

    clearEffects();

    clearInterval(typingTimer);

    showScreen("screen2");

}



/* ==================================================
   START AGAIN
================================================== */

function startAgain(){

    clearEffects();

    clearInterval(typingTimer);


    userName = "";


    if(photoURL){

        URL.revokeObjectURL(photoURL);

    }


    photoURL = "";


    document
    .getElementById("nameInput")
    .value = "";


    document
    .getElementById("photoInput")
    .value = "";


    document
    .getElementById("photoPreview")
    .style.display = "none";


    document
    .getElementById("resultMessage")
    .innerHTML = "";


    document
    .getElementById("resultTitle")
    .textContent = "";


    document.body.className = "";


    showScreen("screen1");

}



/* ==================================================
   BUTTON SPARK EFFECT
================================================== */

document.addEventListener(
    "click",
    function(e){

        if(
            e.target.classList.contains("btn") ||
            e.target.classList.contains("option")
        ){

            for(let i=0;i<8;i++){

                const spark =
                    document.createElement("div");


                spark.textContent = "✨";


                spark.style.position =
                    "fixed";


                spark.style.left =
                    e.clientX + "px";


                spark.style.top =
                    e.clientY + "px";


                spark.style.zIndex =
                    "999";


                spark.style.pointerEvents =
                    "none";


                spark.style.fontSize =
                    "18px";


                document.body.appendChild(
                    spark
                );


                const angle =
                    Math.random() *
                    Math.PI * 2;


                const distance =
                    30 +
                    Math.random()*70;


                spark.animate(

                    [
                        {
                            transform:"translate(0,0)",
                            opacity:1
                        },

                        {
                            transform:
                            `translate(
                                ${Math.cos(angle)*distance}px,
                                ${Math.sin(angle)*distance}px
                            )`,
                            opacity:0
                        }
                    ],

                    {
                        duration:650,
                        easing:"ease-out"
                    }

                );


                setTimeout(function(){

                    spark.remove();

                },700);

            }

        }

    }
);


/* ==================================================
   INITIAL
================================================== */

showScreen("screen1");

</script>

</body>
</html>
